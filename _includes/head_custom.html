<!-- Injected into <head> after the theme stylesheets. This theme ships prebuilt
     CSS, so _sass overrides are not compiled; override here instead.

     By default Just the Docs centers the sidebar + content together, leaving
     large empty gutters on both sides on wide screens. Pin the sidebar to a
     fixed width on the left and let the content use the remaining width. -->
<style>
  @media (min-width: 66.5rem) {
    .side-bar {
      width: 264px !important;
      min-width: 264px !important;
      align-items: flex-start !important;
    }

    .side-bar .site-header,
    .side-bar .site-nav {
      width: 264px !important;
      max-width: 264px !important;
    }

    .main {
      margin-left: 264px !important;
      max-width: none !important;
    }

    .main-content-wrap,
    .main-content {
      max-width: none !important;
    }
  }
</style>
